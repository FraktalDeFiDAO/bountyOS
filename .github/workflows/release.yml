name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag to release (example: v1.2.3)"
        required: true
        type: string

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref || inputs.release_tag }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  secrets-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          version="v8.24.2"
          arch="$(uname -m)"
          case "$arch" in
            x86_64|amd64) arch_suffix="x64" ;;
            aarch64|arm64) arch_suffix="arm64" ;;
            *)
              echo "Unsupported architecture for gitleaks: $arch" >&2
              exit 1
              ;;
          esac
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/${version}/gitleaks_${version#v}_linux_${arch_suffix}.tar.gz" -o "$tmpdir/gitleaks.tgz"
          tar -xzf "$tmpdir/gitleaks.tgz" -C "$tmpdir"
          install -m 0755 "$tmpdir/gitleaks" /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan tracked files
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE_SHA"
            head="$PR_HEAD_SHA"
          elif [ "$EVENT_NAME" = "push" ]; then
            base="$BEFORE_SHA"
            head="$GITHUB_SHA"
          else
            if git rev-parse HEAD~1 >/dev/null 2>&1; then
              base="$(git rev-parse HEAD~1)"
            else
              base="$(git rev-parse HEAD)"
            fi
            head="$(git rev-parse HEAD)"
          fi

          if [ -z "${base:-}" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="$(git rev-list --max-parents=0 HEAD | tail -n1)"
          fi

          changed_files="$(git diff --name-only --diff-filter=ACMR "$base" "$head" || true)"
          if [ -z "$changed_files" ]; then
            echo "No changed files to scan."
            exit 0
          fi

          scan_root="$(mktemp -d)"
          trap 'rm -rf "$scan_root"' EXIT
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            if [ -f "$file" ]; then
              mkdir -p "$scan_root/$(dirname "$file")"
              cp "$file" "$scan_root/$file"
            fi
          done <<< "$changed_files"

          if ! find "$scan_root" -type f | grep -q .; then
            echo "No existing changed files to scan."
            exit 0
          fi

          gitleaks dir "$scan_root" --redact --verbose --no-banner

  build-artifacts:
    name: Build Release Artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: secrets-scan
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build backend binary
        run: |
          set -euo pipefail
          mkdir -p dist
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -o dist/obsidian-linux-amd64 ./cmd/obsidian
          tar -C dist -czf dist/obsidian-linux-amd64.tar.gz obsidian-linux-amd64

      - name: Build frontend bundle
        working-directory: web
        run: |
          set -euo pipefail
          npm ci
          npm run build

      - name: Package frontend bundle
        run: |
          set -euo pipefail
          tar -C web/dist -czf dist/web-dist.tar.gz .
          sha256sum dist/*.tar.gz > dist/SHA256SUMS

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: dist/*
          if-no-files-found: error

  image:
    name: Build and Push Container Image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: build-artifacts
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set release tag
        id: vars
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            tag="${GITHUB_REF#refs/tags/}"
          else
            tag="${{ inputs.release_tag }}"
          fi
          image_repo="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          image_name="ghcr.io/${image_repo}/bountyos-obsidian"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "image_name=$image_name" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.vars.outputs.image_name }}:${{ steps.vars.outputs.tag }}
            ${{ steps.vars.outputs.image_name }}:sha-${{ github.sha }}

  github-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - build-artifacts
      - image
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: dist

      - name: Set release metadata
        id: vars
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            tag="${GITHUB_REF#refs/tags/}"
          else
            tag="${{ inputs.release_tag }}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/obsidian-linux-amd64.tar.gz
            dist/web-dist.tar.gz
            dist/SHA256SUMS
