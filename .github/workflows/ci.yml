name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          version="v8.24.2"
          arch="$(uname -m)"
          case "$arch" in
            x86_64|amd64) arch_suffix="x64" ;;
            aarch64|arm64) arch_suffix="arm64" ;;
            *)
              echo "Unsupported architecture for gitleaks: $arch" >&2
              exit 1
              ;;
          esac
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/${version}/gitleaks_${version#v}_linux_${arch_suffix}.tar.gz" -o "$tmpdir/gitleaks.tgz"
          tar -xzf "$tmpdir/gitleaks.tgz" -C "$tmpdir"
          install -m 0755 "$tmpdir/gitleaks" /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan tracked files
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE_SHA"
            head="$PR_HEAD_SHA"
          elif [ "$EVENT_NAME" = "push" ]; then
            base="$BEFORE_SHA"
            head="$GITHUB_SHA"
          else
            if git rev-parse HEAD~1 >/dev/null 2>&1; then
              base="$(git rev-parse HEAD~1)"
            else
              base="$(git rev-parse HEAD)"
            fi
            head="$(git rev-parse HEAD)"
          fi

          if [ -z "${base:-}" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="$(git rev-list --max-parents=0 HEAD | tail -n1)"
          fi

          changed_files="$(git diff --name-only --diff-filter=ACMR "$base" "$head" || true)"
          if [ -z "$changed_files" ]; then
            echo "No changed files to scan."
            exit 0
          fi

          scan_root="$(mktemp -d)"
          trap 'rm -rf "$scan_root"' EXIT
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            if [ -f "$file" ]; then
              mkdir -p "$scan_root/$(dirname "$file")"
              cp "$file" "$scan_root/$file"
            fi
          done <<< "$changed_files"

          if ! find "$scan_root" -type f | grep -q .; then
            echo "No existing changed files to scan."
            exit 0
          fi

          gitleaks dir "$scan_root" --redact --verbose --no-banner

  backend:
    name: Backend Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: secrets-scan
    env:
      BOUNTYOS_DISABLE_RATE_LIMIT_SLEEP: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download Go modules
        run: go mod download

      - name: Build backend
        run: go build -o obsidian ./cmd/obsidian

      - name: Run backend tests
        run: go test ./...

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: obsidian-linux-amd64
          path: obsidian
          if-no-files-found: error

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: secrets-scan
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error
